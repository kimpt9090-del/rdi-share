```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>작업계획 및 점검현황 대시보드</title>

<!-- 카카오톡 링크 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:title" content="작업계획 및 점검현황 대시보드">
<meta property="og:description"
      content="SDS 구미 AI 데이터센터 · 작업계획과 점검현황을 확인하세요">
<meta property="og:image"
      content="https://kimpt9090-del.github.io/rdi-share/preview.png">
<meta property="og:url"
      content="https://kimpt9090-del.github.io/rdi-share/share.html">

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
        crossorigin="anonymous"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, "Noto Sans KR", sans-serif;
  background: #f1e9d4;
  color: #1b2536;
}

.box {
  width: 100%;
  max-width: 420px;
  padding: 22px;
  background: #fffcf2;
  border: 1px solid #d3c59f;
  border-radius: 14px;
  box-shadow: 0 4px 14px rgba(110,85,30,.15);
}

h1 {
  margin: 0 0 14px;
  font-size: 19px;
}

.preview {
  margin-bottom: 14px;
  padding: 12px;
  border: 1px solid #e0d6b8;
  border-radius: 10px;
  background: white;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #fee500;
  color: #191919;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.sub {
  display: block;
  margin-top: 12px;
  color: #586477;
  text-align: center;
  text-decoration: none;
  font-size: 13px;
}

.err {
  display: none;
  margin-top: 12px;
  color: #c0262d;
  font-size: 13px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="box">
  <h1>💬 카카오톡으로 대시보드 공유</h1>

  <div class="preview" id="pv"></div>

  <button id="shareBtn">카카오톡으로 공유하기</button>

  <a class="sub" id="open" href="#">
    대시보드 바로 열기 ›
  </a>

  <div class="err" id="err"></div>
</div>

<script>
// 카카오 JavaScript 키
const KAKAO_JS_KEY = '85f00cb056f014ea3ec4772a410d5044';

// 실제 대시보드 주소
const DASHBOARD_URL =
  'https://script.google.com/macros/s/AKfycbxkr48bdRxGnSpLqYRfz8Nlmm7r9n4l5ffCxEEnHWRP5EYFMb3Q4XP-g-tyo989Qfbxdw/exec';

// 미리보기 이미지 주소
const PREVIEW_IMAGE =
  'https://kimpt9090-del.github.io/rdi-share/preview.png';

// 기본 공유 문구
const DEFAULT_TEXT =
  'SDS 구미 AI 데이터센터 · 작업계획과 점검현황을 확인하세요';

const Q = new URLSearchParams(location.search);

// ?go=1로 접속하면 실제 대시보드로 이동
if (Q.get('go') === '1') {
  location.replace(DASHBOARD_URL);
}

const TEXT = (Q.get('t') || DEFAULT_TEXT).slice(0, 200);

document.getElementById('pv').textContent = TEXT;
document.getElementById('open').href = DASHBOARD_URL;

function showError(message) {
  const el = document.getElementById('err');
  el.textContent = message;
  el.style.display = 'block';
}

document.getElementById('shareBtn').onclick = function () {
  try {
    if (!window.Kakao) {
      showError('카카오 SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
      return;
    }

    if (!Kakao.isInitialized()) {
      Kakao.init(KAKAO_JS_KEY);
    }

    const link = {
      mobileWebUrl: DASHBOARD_URL,
      webUrl: DASHBOARD_URL
    };

    // 제목, 설명, 이미지, 버튼이 포함된 카드 공유
    Kakao.Share.sendDefault({
      objectType: 'feed',

      content: {
        title: '작업계획 및 점검현황 대시보드',
        description: TEXT,
        imageUrl: PREVIEW_IMAGE,
        link: link
      },

      buttons: [
        {
          title: '대시보드 열기',
          link: link
        }
      ]
    });

  } catch (e) {
    showError(
      '공유 실패: ' + (e.message || e) +
      ' · JavaScript 키와 도메인 설정을 확인하세요.'
    );
  }
};
</script>
</body>
</html>
```
