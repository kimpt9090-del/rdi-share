<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업계획 및 점검현황 대시보드</title>
<!-- 카톡에 이 페이지 주소를 붙여넣었을 때 보이는 미리보기 (주소 뒤에 ?go=1 을 붙여 공유) -->
<meta property="og:type" content="website">
<meta property="og:title" content="작업계획 및 점검현황 대시보드">
<meta property="og:description" content="SDS 구미 AI 데이터센터 · 눌러서 모바일 대시보드를 확인하세요">
<!-- <meta property="og:image" content="https://계정.github.io/저장소/preview.png"> 800x400 정도 이미지를 같은 저장소에 올리면 미리보기에 사진이 붙습니다 -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<script>
// ▼▼ 여기 두 줄만 본인 값으로 바꾸세요 ▼▼
const KAKAO_JS_KEY = '여기에_카카오_JavaScript_키';
const DASHBOARD_URL = 'https://script.google.com/macros/s/여기에_배포ID/exec';
// ▲▲
const Q = new URLSearchParams(location.search);
if (Q.get('go') === '1') location.replace(DASHBOARD_URL);   // 짧은 링크 모드: 미리보기는 위 og 태그, 눌러 들어오면 바로 대시보드로 이동
const DEFAULT_TEXT = '[작업계획 및 점검현황 업데이트]\n\n아래 버튼을 눌러 모바일 대시보드를 확인하세요.';
</script>
<style>
body{margin:0;font-family:"Noto Sans KR",Arial,sans-serif;background:#f1e9d4;color:#1b2536;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.box{background:#fffcf2;border:1.5px solid #d3c59f;border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 4px 14px rgba(110,85,30,.15)}
h1{font-size:18px;margin:0 0 12px}pre{white-space:pre-wrap;background:#fff;border:1px solid #e0d6b8;border-radius:10px;padding:12px;font:14px/1.6 inherit;margin:0 0 14px}
button{width:100%;border:0;border-radius:10px;background:#fee500;color:#191919;font-size:16px;font-weight:800;padding:13px;cursor:pointer}
.sub{display:block;text-align:center;margin-top:10px;color:#6b7688;font-size:13px;text-decoration:none}.err{color:#c0262d;font-size:13px;margin-top:10px;display:none}
</style></head><body>
<div class="box"><h1>💬 카카오톡으로 대시보드 공유</h1><pre id="pv"></pre>
<button id="go">카카오톡으로 공유하기</button><a class="sub" id="open" href="#">대시보드 바로 열기 ›</a><div class="err" id="err"></div></div>
<script>
const TEXT = (Q.get('t') || DEFAULT_TEXT).slice(0, 200);   // 카카오 text 템플릿은 최대 200자
document.getElementById('pv').textContent = TEXT;
document.getElementById('open').href = DASHBOARD_URL;
const fail = m => { const e = document.getElementById('err'); e.textContent = m; e.style.display = 'block'; };
document.getElementById('go').onclick = function () {
  try {
    if (!window.Kakao) return fail('카카오 SDK를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
    const link = { mobileWebUrl: DASHBOARD_URL, webUrl: DASHBOARD_URL };
    Kakao.Share.sendDefault({ objectType: 'text', text: TEXT, link: link, buttons: [{ title: '대시보드 열어하기', link: link }] });
  } catch (e) { fail('공유 실패: ' + (e.message || e) + ' (JavaScript 키와 등록한 도메인을 확인해 주세요)'); }
};
</script></body></html>
