<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업계획 및 점검현황 대시보드</title>

<!-- 이 페이지 주소를 카톡에 그대로 붙여넣었을 때 보이는 미리보기 (주소 뒤에 ?go=1 을 붙여 공유하면 누르는 즉시 대시보드로 이동) -->
<meta property="og:type" content="website">
<meta property="og:title" content="작업계획 및 점검현황 대시보드">
<meta property="og:description" content="SDS 구미 AI 데이터센터 · 작업계획과 점검현황을 확인하세요">
<meta property="og:image" content="https://kimpt9090-del.github.io/rdi-share/preview.png">
<meta property="og:url" content="https://kimpt9090-del.github.io/rdi-share/share.html">

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,"Noto Sans KR",sans-serif;background:#f1e9d4;color:#1b2536}
.box{width:100%;max-width:420px;padding:22px;background:#fffcf2;border:1px solid #d3c59f;border-radius:14px;box-shadow:0 4px 14px rgba(110,85,30,.15)}
h1{margin:0 0 14px;font-size:19px}
.preview{margin-bottom:14px;padding:12px;border:1px solid #e0d6b8;border-radius:10px;background:#fff;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#fee500;color:#191919;font-size:16px;font-weight:800;cursor:pointer}
.sub{display:block;margin-top:12px;color:#586477;text-align:center;text-decoration:none;font-size:13px}
.err{display:none;margin-top:12px;color:#c0262d;font-size:13px;overflow-wrap:anywhere}
.dom{margin-top:14px;color:#8a8470;font-size:11px;text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
  <h1>💬 카카오톡으로 대시보드 공유</h1>
  <div class="preview" id="pv"></div>
  <button id="shareBtn">카카오톡으로 공유하기</button>
  <a class="sub" id="open" href="#">대시보드 바로 열기 ›</a>
  <div class="err" id="err"></div>
  <div class="dom" id="dom"></div>
</div>

<script>
// ===== 설정 (바꿀 일이 생기면 이 부분만 수정) =====
const KAKAO_JS_KEY  = '85f00cb056f014ea3ec4772a410d5044';
const DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbxuiJaIuQcIaW5cmen021IHHSqG_tyKFEIj7sW1eamQiN7inIBrfnObvvfHYYp_lnmEGQ/exec';
const PREVIEW_IMAGE = 'https://kimpt9090-del.github.io/rdi-share/preview.png';   // 이미지 카드(?card=1)로 보낼 때만 사용
const BUTTON_TITLE  = '대시보드';
const DEFAULT_TEXT  = '[작업계획 및 점검현황 대시보드]\n\n대시보드 버튼을 눌러 대시보드를 확인하세요.';
// ================================================

const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search);

// ?go=1 : 짧은 링크 모드 → 바로 대시보드로 이동
if (Q.get('go') === '1') location.replace(DASHBOARD_URL);

const TEXT = (Q.get('t') || DEFAULT_TEXT).slice(0, 200);   // 카카오 텍스트 템플릿은 최대 200자
const CARD = Q.get('card') === '1';                          // ?card=1 : 이미지가 있는 카드 형태로 공유

$('pv').textContent = TEXT;
$('open').href = DASHBOARD_URL;
$('dom').textContent = '현재 도메인: ' + location.origin;

// 카드 모드: 이미지가 실제로 열리는지 미리 확인 (안 열리면 텍스트 형태로 자동 전환)
let IMG_OK = null;
if (CARD) { const im = new Image(); im.onload = () => IMG_OK = true; im.onerror = () => IMG_OK = false; im.src = PREVIEW_IMAGE; }

function fail(msg) { const e = $('err'); e.textContent = msg; e.style.display = 'block'; }

$('shareBtn').onclick = function () {
  try {
    if (!window.Kakao) return fail('카카오 SDK를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
    const link = { mobileWebUrl: DASHBOARD_URL, webUrl: DASHBOARD_URL };
    const buttons = [{ title: BUTTON_TITLE, link: link }];
    if (CARD && IMG_OK === true) {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: { title: '작업계획 및 점검현황 대시보드', description: TEXT, imageUrl: PREVIEW_IMAGE, link: link },
        buttons: buttons
      });
    } else {
      Kakao.Share.sendDefault({ objectType: 'text', text: TEXT, link: link, buttons: buttons });
    }
  } catch (e) {
    fail('공유 실패: ' + (e.message || e) + ' · 현재 주소(' + location.origin + ')가 카카오 [JavaScript SDK 도메인]에 등록되어 있는지, JavaScript 키가 맞는지 확인하세요.');
  }
};
</script>
</body>
</html>
